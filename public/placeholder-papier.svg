<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fffbeb"/>
  <!-- Paper roll -->
  <ellipse cx="200" cy="190" rx="80" ry="25" fill="#fde68a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="120" y="190" width="160" height="90" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <ellipse cx="200" cy="280" rx="80" ry="25" fill="#fde68a" stroke="#fbbf24" stroke-width="2"/>
  <!-- Lines on paper -->
  <line x1="145" y1="215" x2="255" y2="215" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 3"/>
  <line x1="145" y1="230" x2="255" y2="230" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 3"/>
  <line x1="145" y1="245" x2="255" y2="245" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 3"/>
  <line x1="145" y1="260" x2="255" y2="260" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 3"/>
  <!-- Label -->
  <rect x="130" y="318" width="140" height="28" rx="14" fill="#f59e0b" opacity="0.15"/>
  <text x="200" y="337" text-anchor="middle" fill="#b45309" font-size="13" font-family="Arial, sans-serif" font-weight="600">Papier d'emballage</text>
</svg>
