<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fff7ed"/>
  <!-- Container body -->
  <rect x="120" y="150" width="160" height="110" rx="10" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/>
  <!-- Lid -->
  <rect x="112" y="138" width="176" height="22" rx="8" fill="#fb923c" stroke="#f97316" stroke-width="1.5"/>
  <!-- Compartment lines -->
  <line x1="200" y1="152" x2="200" y2="260" stroke="#fdba74" stroke-width="1.5"/>
  <line x1="120" y1="210" x2="280" y2="210" stroke="#fdba74" stroke-width="1.5"/>
  <!-- Steam dots -->
  <circle cx="165" cy="120" r="5" fill="#fb923c" opacity="0.4"/>
  <circle cx="200" cy="112" r="5" fill="#fb923c" opacity="0.4"/>
  <circle cx="235" cy="120" r="5" fill="#fb923c" opacity="0.4"/>
  <!-- Label -->
  <rect x="100" y="285" width="200" height="28" rx="14" fill="#f97316" opacity="0.15"/>
  <text x="200" y="304" text-anchor="middle" fill="#c2410c" font-size="13" font-family="Arial, sans-serif" font-weight="600">Emballage Alimentaire</text>
</svg>
