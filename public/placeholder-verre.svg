<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f0f9ff"/>
  <!-- Jar body -->
  <path d="M155 180 Q148 185 145 240 Q143 285 200 288 Q257 285 255 240 Q252 185 245 180Z" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2" opacity="0.8"/>
  <!-- Jar neck -->
  <rect x="168" y="162" width="64" height="22" rx="6" fill="#93c5fd" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- Jar lid -->
  <rect x="160" y="152" width="80" height="16" rx="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Shine effect -->
  <path d="M165 195 Q162 215 163 240" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <circle cx="175" cy="188" r="4" fill="white" opacity="0.4"/>
  <!-- Label band on jar -->
  <rect x="145" y="225" width="110" height="35" fill="white" opacity="0.5"/>
  <line x1="145" y1="225" x2="255" y2="225" stroke="#7dd3fc" stroke-width="1"/>
  <line x1="145" y1="260" x2="255" y2="260" stroke="#7dd3fc" stroke-width="1"/>
  <!-- Category label -->
  <rect x="120" y="308" width="160" height="28" rx="14" fill="#0284c7" opacity="0.12"/>
  <text x="200" y="327" text-anchor="middle" fill="#0369a1" font-size="13" font-family="Arial, sans-serif" font-weight="600">Verre &amp; Cristal</text>
</svg>
